:root{--paper:#f5f4ef;--ink:#202e32;--muted:#697779;--green:#245c50;--line:#dce2dc;--soft:#edf2ec;--gold:#936c33;--white:#fffefb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.75 "Microsoft YaHei",system-ui,sans-serif}a{color:var(--green);text-decoration:none}button,input,textarea,select{font:inherit}button,.button{display:inline-block;padding:9px 16px;border:1px solid var(--line);border-radius:9px;background:var(--white);color:var(--green);cursor:pointer}button:hover,.button:hover{background:var(--soft)}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5;cursor:wait}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9abbaa;outline-offset:3px}.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.sidebar{background:#e9eee7;border-right:1px solid var(--line);padding:30px 22px;height:100vh;position:sticky;top:0;overflow:auto}.brand{font-family:Georgia,serif;font-size:24px;letter-spacing:.5px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);text-transform:uppercase;font-weight:700}.sidebar h2{font-size:15px;font-weight:500;margin:12px 0 24px}.nav-link{display:block;padding:10px 12px;margin:5px 0;border-radius:8px;color:#4b5b56}.nav-link.active{background:var(--white);color:var(--green);font-weight:700}.sidebar small{display:block;margin-top:22px;color:var(--muted)}.chapter-nav{margin-top:20px;border-top:1px solid #cfd9cf;padding-top:14px}.chapter-nav a{display:block;padding:7px 0;color:#52645c;font-size:13px}main{max-width:1320px;width:100%;margin:0 auto;padding:36px 46px 70px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;color:var(--muted);font-size:12px;margin-bottom:32px}.hero{display:flex;gap:24px;justify-content:space-between;align-items:end;margin-bottom:28px}.hero h1{font-size:32px;font-weight:600;letter-spacing:-1px;line-height:1.4;margin:8px 0 12px}.hero p{max-width:720px;color:var(--muted);margin:0}.pill{display:inline-block;padding:3px 10px;background:var(--soft);color:var(--green);border-radius:20px;font-size:12px;margin:3px 5px 3px 0}.pill.gold{background:#f3ecde;color:var(--gold)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}.metric{padding:19px 22px;border:1px solid var(--line);background:var(--white);border-radius:12px}.metric b{font:32px/1.4 Georgia,serif;display:block}.metric span{font-size:12px;color:var(--muted)}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin:30px 0 14px}.section-title h2{font-size:19px;margin:0;font-weight:600}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{padding:24px;border:1px solid var(--line);background:var(--white);border-radius:12px;min-width:0}.card h3{margin:3px 0 10px;font-size:18px;font-weight:600}.card h4{margin:15px 0 6px}.card p{margin:8px 0}.card ul{padding-left:20px;margin:8px 0}.chapter-index{font:13px Georgia,serif;letter-spacing:2px;color:#8c9d8d}.skill-row{padding:11px 0;border-top:1px solid #e9ece7}.skill-row>div{display:flex;justify-content:space-between;align-items:center;gap:12px}.skill-row .muted{line-height:1.7}.notice{padding:17px 21px;border-left:3px solid #8aa98c;background:#eaf0e6;margin:18px 0;border-radius:0 9px 9px 0}.notice.warm{background:#f5eddf;border-color:#bb985d}.question-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.question-card{display:block;border:1px solid var(--line);background:var(--white);padding:19px 21px;border-radius:10px;color:var(--ink)}.question-card:hover{border-color:#8aa98c}.question-card strong{font-size:17px}.question-card p{margin:6px 0 0}.toolbar{display:flex;gap:10px;align-items:center;margin:15px 0;flex-wrap:wrap}input[type=search]{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:10px 14px;width:min(100%,410px)}.detail-nav{display:flex;gap:20px;flex-wrap:wrap;padding:10px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px;font-size:13px}.detail-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:20px}.detail-grid>.card{align-self:start}.prompt{width:100%;height:auto;display:block;mix-blend-mode:multiply;margin:12px 0}.ink{width:100%;height:auto;display:block;background:#fff;border:1px solid #edf0eb;border-radius:6px;margin:12px 0}.ink-label{font-size:12px;color:var(--muted);padding-top:10px}details{margin:14px 0;border:1px solid var(--line);border-radius:9px;padding:14px 17px;background:#fffefb}summary{cursor:pointer;color:var(--green);font-weight:600}.formula{max-width:100%;overflow-x:auto;padding:9px 2px;font-size:19px;margin:5px 0}math{font-family:"Cambria Math",serif}h3{line-height:1.5}.answer-result{padding:12px 18px;background:var(--soft);border-left:3px solid var(--green);margin:20px 0}.feedback-item{border-bottom:1px solid #e9ece7;padding:12px 0}.feedback-item:last-child{border:0}.evidence{font:11px/1.6 Consolas,monospace;overflow-wrap:anywhere;color:var(--muted)}.attempt{margin:12px 0;padding:16px;border-left:2px solid #a7baa6;background:#f2f5ee}.attempt pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:7px 0}textarea{width:100%;min-height:140px;resize:vertical;padding:12px;border:1px solid #b9cbbb;border-radius:8px;background:#fff;margin-top:7px}select{padding:8px;border:1px solid var(--line);border-radius:7px;max-width:100%;background:white}.inline-links{display:flex;gap:10px;flex-wrap:wrap}.empty{padding:28px 15px;text-align:center;color:var(--muted);border:1px dashed #c5cfc3;border-radius:8px}.practice{margin:20px 0}.practice .card{margin:12px 0}.practice-hidden{display:none}.step-marker{font-size:12px;letter-spacing:1px;color:var(--green);margin-bottom:8px}#toast{position:fixed;right:22px;bottom:22px;z-index:9;padding:14px 20px;background:#213e35;color:white;border-radius:10px;box-shadow:0 8px 30px #20362b30;max-width:calc(100vw - 44px);display:none}.footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.review-instructions code{word-break:break-all}.draft-saved{font-size:12px;color:var(--green)}[hidden]{display:none!important}
@media(min-width:1500px){main{padding-right:70px;padding-left:70px}}@media(max-width:1050px){.shell{grid-template-columns:210px minmax(0,1fr)}main{padding:28px}.sidebar{padding:25px 16px}.detail-grid{grid-template-columns:1fr}.hero h1{font-size:27px}.metrics{gap:9px}.metric{padding:15px}.grid{grid-template-columns:1fr}}@media(max-width:680px){.shell{display:block}.sidebar{position:relative;height:auto;padding:17px 18px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}.brand{font-size:20px}.sidebar h2,.sidebar small,.chapter-nav{display:none}.nav-link{margin:0;padding:5px 8px;font-size:13px}.sidebar .eyebrow{width:100%;font-size:9px}.sidebar>a:last-of-type{display:none}main{padding:22px 17px 50px}.topbar{margin-bottom:20px}.hero{display:block}.hero h1{font-size:25px}.metrics{grid-template-columns:repeat(2,1fr);margin:20px 0}.metric b{font-size:27px}.question-list{grid-template-columns:1fr}.card{padding:19px}.detail-nav{gap:14px}.section-title{align-items:start}.section-title h2{font-size:18px}}@media print{.sidebar,.topbar,.detail-nav,button,.toolbar,#toast{display:none!important}.shell,main{display:block;padding:0}.card,details{break-inside:avoid}.grid,.detail-grid{display:block}.card{margin:12px 0}body{background:white}.practice-hidden{display:block}}
</style>

<body><div class="shell"><aside class="sidebar"><div class="eyebrow">PERSONAL LEARNING / 本地</div><div class="brand">我的知识库<span style="color:#829b80">.</span></div><h2>__COURSE_TITLE__</h2><a class="nav-link" data-nav="overview" href="#overview">学习总览</a><a class="nav-link" data-nav="questions" href="#questions">原题与作答</a><a class="nav-link" data-nav="practice" href="#practice">复习与补强</a><div class="chapter-nav" id="chapters"></div><a class="nav-link" href="/">采集工作台 ↗</a><small>原题 → 作答 → 核对 → 变式 → 间隔复习<br>每次学习留下可追溯的记录。</small></aside><main><div class="topbar"><span>学习 / <span id="breadcrumb"></span></span><span id="updated"></span></div><div id="view"></div><div class="footer">数据保存在当前工作空间。课程目录、题目、练习和学习记录可整体迁移；提示与参考答案由当前聊天核对。<span id="fresh"></span></div></main></div><div id="toast" role="status" aria-live="polite"></div>
<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('snapshot').textContent), V=document.getElementById('view');
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=id=>D.questions.find(q=>q.id===id), kp=id=>D.catalog.knowledge_points.find(k=>k.id===id);
const date=t=>t?new Date(t*1000).toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',month:'short',day:'numeric'}):'待安排';
const pill=(s,warm=false)=>`<span class="pill ${warm?'gold':''}">${h(s)}</span>`;
const skillPills=q=>q.knowledge_ids.map(id=>pill(kp(id).title)).join('');
const qlink=id=>`#question=${encodeURIComponent(id)}`;
const state=id=>D.states[id];
const feedbackText=v=>typeof v==='string'?v:v?.text||'';
const header=(k,title,desc)=>`<div class="hero"><div><div class="eyebrow">${h(k)}</div><h1>${h(title)}</h1><p>${h(desc)}</p></div></div>`;
function toast(s){const n=document.getElementById('toast');n.textContent=s;n.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.style.display='none',6000)}
async function send(body){
 if(location.protocol==='file:')throw Error('请通过本机课程服务打开页面后保存；离线文件可阅读。');
 const r=await fetch('/api/knowledge/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const result=await r.json();if(!r.ok)throw Error(result.error||'保存失败');return result;
}
const actionBody=(kind,extra)=>({id:crypto.randomUUID(),course_id:D.course.id,kind,...extra});
async function generate(qid,button){
 button.disabled=true;
 try{const result=await send(actionBody('generate',{question_id:qid}));
 const prompt=`请处理本机个性化补强任务 ${result.request_path}。读取 ${D.storage_root}/knowledge/${D.course.id}/snapshot.json 的原题、作答、建议和掌握证据。按任务 response_schema 生成三道可核对的新题，把 JSON 保存到 ${result.incoming_path}。不修改旧题或旧反馈。`;
 let copied=false;try{await navigator.clipboard.writeText(prompt);copied=true}catch(e){}
 const box=document.createElement('div');box.className='notice review-instructions';const p=document.createElement('p');p.textContent=copied?'已保存补强任务并复制指令，粘贴到当前聊天即可生成新题。':'已保存补强任务。将下方指令发给当前聊天：';const pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.style.overflowWrap='anywhere';pre.textContent=prompt;box.append(p,pre);button.parentElement.after(box);toast('补强任务已保存，刷新后仍可查看。');
 }catch(e){toast(e.message)}finally{button.disabled=false}
}
function questionCard(q){const a=q.activity;return `<a class="question-card" href="${qlink(q.id)}"><span class="chapter-index">${h(q.id)}</span><br><strong>${h(q.label)}</strong><p>${skillPills(q)}</p><span class="muted">${a?.has_activity?'已记录笔迹 · '+a.observed_writing_seconds.toFixed(2)+' 秒接触时间':'尚未记录作答'} · ${q.reference_html?'附完整参考解答':'参考解答待补充'}</span></a>`}
function overview(){
 const practiced=Object.values(D.states).filter(x=>['independent','retained'].includes(x.state)).length;
 const done=D.questions.filter(q=>q.activity?.has_activity).length;
 V.innerHTML=header('LEARNING ATLAS','把每道题，变成自己的知识。',D.course.title)+`<div class="metrics"><div class="metric"><b>${D.catalog.chapters.length.toString().padStart(2,'0')}</b><span>建议学习章节</span></div><div class="metric"><b>${D.catalog.knowledge_points.length}</b><span>整理出的知识点</span></div><div class="metric"><b>${done} <small style="font:15px system-ui;color:var(--muted)">/ ${D.questions.length}</small></b><span>已有真实作答的原题</span></div><div class="metric"><b>${practiced}</b><span>有独立完成证据的知识点</span></div></div><div class="notice">${h(D.catalog.scope_note)}<br><span class="muted">掌握状态按作答和复练证据更新；一次独立完成后建议 3 天复习，不同题间隔至少 1 天再次完成后建议 7 天复习。这是可调整的起始安排。</span></div><div class="section-title"><h2>接下来，先做好这一步</h2><a href="#practice">查看补强计划 →</a></div><div class="card"><div class="step-marker">01 核对已有作答 → 02 做一道变式 → 03 间隔后再检验</div><p>先打开有笔迹的原题，核对建议和解答；接着用同知识点的新题独立检查。记录不清的地方先确认，不用反复抄写已经看懂的答案。</p><div class="inline-links">${D.questions.filter(q=>q.activity?.has_activity).map(q=>`<a class="button" href="${qlink(q.id)}">查看 ${h(q.label)} →</a>`).join('')||'<a href="#questions">选择一道原题开始 →</a>'}</div></div><div class="section-title"><h2>课程路线 · ${D.catalog.chapters.length} 章</h2><span class="muted">点进题目，让知识点回到具体问题</span></div><div class="grid">${D.catalog.chapters.map((c,i)=>`<article class="card" id="chapter-${h(c.id)}"><div class="chapter-index">CHAPTER ${String(i+1).padStart(2,'0')}</div><h3>${h(c.title)}</h3><ul>${(c.goals||[]).map(g=>`<li>${h(g)}</li>`).join('')}</ul>${D.catalog.knowledge_points.filter(k=>k.chapter_id===c.id).map(k=>`<div class="skill-row"><div><span>${h(k.title)}</span>${pill(state(k.id).label,['needs_work','with_help'].includes(state(k.id).state))}</div><span class="muted">${h(state(k.id).reason)}</span>${k.prerequisites.length?`<div class="muted">前置：${k.prerequisites.map(p=>h(kp(p).title)).join('、')}</div>`:''}<div class="inline-links">${D.questions.filter(q=>q.knowledge_ids.includes(k.id)).map(q=>`<a href="${qlink(q.id)}">${h(q.id)} ↗</a>`).join('')}</div></div>`).join('')}</article>`).join('')}</div>`;
}
function questions(){V.innerHTML=header('QUESTION LIBRARY','原题与作答','每道题都保留原题、你的笔迹、建议、参考解答和后续复练。')+`<div class="toolbar"><label for="search" class="muted">搜索题号或知识点</label><input id="search" type="search" placeholder="例如 Taylor、隐函数、I-2"></div><div class="question-list" id="results">${D.questions.map(questionCard).join('')}</div>`;document.getElementById('search').oninput=e=>{const term=e.target.value.trim().toLowerCase();const result=D.questions.filter(q=>(q.id+' '+q.label+' '+q.knowledge_ids.map(k=>kp(k).title).join(' ')).toLowerCase().includes(term));document.getElementById('results').innerHTML=result.map(questionCard).join('')||'<p class="empty">没有匹配的题目。</p>'}}
function feedback(q){
 if(!q.feedback.length)return '<p class="empty">当前作答尚未得到可追溯的辅导意见。可从下方证据页交给当前聊天核对。</p>';
 return q.feedback.slice().reverse().map(f=>`<div class="feedback-item">${pill(f.current?'针对当前证据的建议':'历史过程建议',!f.current)}${!f.current?'<p class="muted">这条建议针对当时的过程笔迹；尚未据此判断你后来的最终答案。</p>':''}${f.response.observations.map(o=>`<p>${h(o.text)}</p><details><summary>对应笔迹来源</summary><div class="evidence">${o.evidence_ids.map(h).join('<br>')}</div></details>`).join('')}<h4>建议你下一步这样做</h4><ol>${f.response.hints.map(t=>`<li>${h(feedbackText(t))}</li>`).join('')}</ol>${f.response.needs_clarification.length?'<p class="muted">待确认：'+f.response.needs_clarification.map(v=>h(feedbackText(v))).join('；')+'</p>':''}</div>`).join('');
}
function recognition(q){
 const latest=q.latest_request;
 let content=latest?.chat_review_path?`<p>笔迹图已准备好，等待当前聊天逐图识别。</p><button data-chat-review="${h(latest.chat_review_path)}">复制笔迹识别请求</button>`:'';
 if(latest?.recognition_html)content+=`<details><summary>本次识别内容与不确定</summary>${latest.recognition_html}</details>`;
 for(const review of q.archived_recognition||[])content+=`<details><summary>已归档核图：文字、公式与标注</summary><p class="muted">针对当时的过程记录；保留拒绝片段，不判断后来擦改后的最终答案。</p>${review.images.map((p,i)=>`<img class="ink" src="${h(p.url)}" alt="${h(q.id)} 归档笔迹 ${i+1}">`).join('')}${review.recognition_html}</details>`;
 return content?'<h3>笔迹识别记录</h3>'+content:'';
}
function question(id){
 const q=qs(id);if(!q){V.innerHTML='<p>找不到这道题。<a href="#questions">返回原题库</a></p>';return}
 const ink=q.ink_request,a=q.activity;
 V.innerHTML=header('QUESTION / '+q.id,q.label,'原题、作答和知识点放在一起，方便核对和再次复习。')+`<div class="detail-nav"><a href="#questions">← 全部题目</a><a href="#" data-scroll="original">原题与笔迹</a><a href="#" data-scroll="suggestions">我的建议</a><a href="#" data-scroll="answer">参考答案</a><a href="#" data-scroll="reinforcement">同类与补强</a></div><div class="detail-grid"><div><section class="card" id="original"><div class="step-marker">01 / ORIGINAL</div><h3>原题</h3>${q.prompt_images.map(p=>`<img class="prompt" src="${h(p.url)}" alt="${h(q.label)}原题，第 ${p.source_page} 页裁切"><p class="muted">来源：原卷第 ${p.source_page} 页</p>`).join('')}<div class="section-title"><h2>你的笔迹</h2>${ink?pill(ink.provisional?'过程记录':'接触轨迹记录'):''}</div>${ink?`<p class="muted">${ink.id!==q.latest_request?.id?'当前完整轨迹尚无合格图片，以下保留较早过程图。':''}轨迹图尚未完整应用撤回、橡皮和套索；最终保存答案仍待核对。</p>${ink.images.map((p,i)=>`<div class="ink-label">书写片段 ${i+1} · ${p.evidence_ids.length} 条接触引用</div><img class="ink" src="${h(p.url)}" alt="${h(q.label)}真实笔迹片段 ${i+1}">`).join('')}`:'<div class="empty">尚无可用笔迹图；保留待确认状态。</div>'}${a?.has_activity?`<p class="muted">原题累计落笔接触 ${a.observed_writing_seconds.toFixed(2)} 秒。它不等于解题总时长，停顿也不等于思考时间。</p>`:''}${q.latest_request?`<a class="button" href="${h(q.latest_request.url)}">查看当前辅导证据 / 交给聊天 →</a>`:''}</section><section class="card" id="suggestions" style="margin-top:20px"><div class="step-marker">02 / FEEDBACK</div><h3>我的建议</h3>${feedback(q)}</section><section class="card" id="answer" style="margin-top:20px"><div class="step-marker">03 / WORKED SOLUTION</div><h3>参考答案与完整推导</h3><p class="muted">先尝试完成，再展开对照思路、关键步骤与易错点。</p><details id="reference"><summary>展开完整解答</summary>${q.reference_html||'<p>参考解答尚待当前聊天补充。</p>'}</details></section></div><aside><section class="card"><div class="step-marker">KNOWLEDGE CONNECTIONS</div><h3>这道题在学什么</h3>${q.knowledge_ids.map(k=>`<div class="skill-row"><h4>${h(kp(k).title)}</h4>${pill(D.catalog.chapters.find(c=>c.id===kp(k).chapter_id).title)}${pill(state(k).label)}<p class="muted">${h(state(k).reason)}</p><p class="muted">${kp(k).prerequisites.length?'前置：'+kp(k).prerequisites.map(p=>h(kp(p).title)).join('、'):'前置：基础定义与运算'}</p>${state(k).due_at_pc?`<p class="muted">建议复习：${date(state(k).due_at_pc)}</p>`:''}</div>`).join('')}<p class="muted">不从笔画数、书写速度或停顿推算掌握百分比。</p></section><section class="card" style="margin-top:20px"><h3>需不需要反复做？</h3><p>${q.knowledge_ids.some(k=>['needs_work','with_help'].includes(state(k).state))?'建议先做一题基础补强，隔天换一题检验；还需要提示，就暂缓增加难度。':q.knowledge_ids.every(k=>state(k).state==='retained')?'已有间隔复练证据，优先转向综合题，约一周后再抽查。':'先用一道同类变式检验能否独立完成。原题答案已经看过时，换题更能检验方法是否会用。'}</p></section><section class="card" style="margin-top:20px"><h3>原卷里的相关题</h3>${q.related_question_ids.length?q.related_question_ids.map(id=>`<p><a href="${qlink(id)}">${h(qs(id).label)} · ${h(id)} →</a></p>`).join(''):'<p class="muted">原卷暂未标出共享知识点的其他题；可用下方新变式补充。</p>'}<p class="muted">共享知识点不代表难度相同，也不一定可以直接套同一解法。</p></section></aside></div><section id="reinforcement"><div class="section-title"><h2>下一轮 · 同类与补强</h2><button class="primary" id="generate">生成下一轮个性化补强题</button></div><p class="muted">任务先保存在本机，由当前聊天读取证据生成新题；新题会回到此页，提交结果后继续更新学习记录。</p><div id="practice-list">${q.practice_ids.map(practiceCard).join('')||'<div class="empty">这里会积累你的基础诊断、同类变式和迁移题。</div>'}</div></section>`;
 document.getElementById('original').insertAdjacentHTML('beforeend',recognition(q));
 V.querySelectorAll('[data-chat-review]').forEach(button=>button.onclick=async()=>{const prompt=`请读取 ${button.dataset.chatReview}，逐张核图，按同目录 prompt.txt 和 response-template.json 保存一份新的 response.json，再用 scripts/recognition_chat.py 校验并经 --learning-root ${D.storage_root} 发布。保留不可用片段，不根据题目补写笔迹，不复活已被替代或完成的旧任务。`;try{await navigator.clipboard.writeText(prompt);toast('已复制；发送到当前聊天继续。')}catch(e){toast(prompt)}});
 document.getElementById('generate').onclick=e=>generate(q.id,e.target);
 V.querySelectorAll('[data-scroll]').forEach(el=>el.onclick=e=>{e.preventDefault();document.getElementById(el.dataset.scroll).scrollIntoView({behavior:'smooth'})});wirePractice();
}
function practiceCard(id){
 const p=D.practice.find(p=>p.id===id), attempts=D.history.filter(e=>e.kind==='attempt'&&e.practice_id===id), seen=D.history.filter(e=>e.kind==='reveal'&&e.practice_id===id);
 return `<article class="card practice" data-practice="${h(id)}"><div class="step-marker">${h(p.level)} / ${h(p.id)}</div><h3>${h(p.title)}</h3><p class="muted">出题理由：${h(p.reason)}</p>${p.prompt_html}<div class="toolbar"><button data-reveal="hint">查看提示</button><button data-reveal="solution">对照参考解答</button><span class="muted">${seen.length?'已记录查看提示或解答':'尽量先独立作答'}</span></div><div class="practice-hidden" data-content="hint"><div class="notice">${p.hints.map(h).join('<br>')}</div></div><div class="practice-hidden" data-content="solution">${p.solution_html}</div><form><label>记录你的作答（可用文字或 LaTeX）<textarea name="answer" required maxlength="8000" placeholder="写下推导、答案和你不确定的地方。这里只保存你实际提交的内容。"></textarea></label><span class="draft-saved"></span><div class="toolbar"><label class="muted">自己的感受 <select name="self_report"><option value="uncertain">还不确定</option><option value="independent_correct">自认为独立完成</option><option value="hinted_correct">提示后完成</option><option value="incorrect">没有做出 / 可能有错</option></select></label><button type="submit" class="primary">保存作答，交给聊天批阅</button></div><p class="muted">自评先作为学习记录；掌握状态等核对实际答案后再更新。</p></form>${attempts.map(a=>{const r=D.history.find(e=>e.kind==='review'&&e.attempt_id===a.id);return `<div class="attempt"><span class="muted">${date(a.created_at_pc)} · ${r?'已批阅':'待批阅'}${a.help_seen?' · 看过提示或解答':''}</span><pre>${h(a.answer)}</pre>${r?`<p><strong>${h(r.rationale)}</strong></p>${r.feedback.map(b=>b.text?`<p>${h(b.text)}</p>`:`<code>${h(b.math)}</code>`).join('')}`:`<button type="button" data-review="${h(a.id)}">复制批阅请求</button>`}</div>`}).join('')}</article>`;
}
function reviewPrompt(attempt){return `请批阅本机知识库作答 ${D.course.id} / ${attempt.practice_id} / ${attempt.id}。读取 ${D.storage_root}/knowledge/${D.course.id}/snapshot.json 中该练习、我的提交和提示查看记录。把 inkbridge-practice-review-v1 JSON 保存到 ${D.storage_root}/knowledge/incoming/ 下新文件，字段为 id（唯一ID）、attempt_id=${attempt.id}、answer_sha256=${attempt.answer_sha256}、outcome（independent_correct/hinted_correct/incorrect/uncertain）、rationale、feedback（text/math 内容块数组）。依据实际推导核对；看过提示或答案不能认定独立完成。`}
function wirePractice(){
 V.querySelectorAll('[data-practice]').forEach(card=>{const id=card.dataset.practice;
 card.querySelectorAll('[data-reveal]').forEach(button=>button.onclick=async()=>{button.disabled=true;try{await send(actionBody('reveal',{practice_id:id,target:button.dataset.reveal}));card.querySelector(`[data-content="${button.dataset.reveal}"]`).style.display='block';toast('已记录查看辅助内容；这次完成将按提示后完成核对。')}catch(e){toast(e.message)}finally{button.disabled=false}});
 const form=card.querySelector('form'),area=form.elements.answer,key='learning-draft:'+D.course.id+':'+id;
 try{area.value=localStorage.getItem(key)||''}catch(e){}
 area.oninput=()=>{try{localStorage.setItem(key,area.value);card.querySelector('.draft-saved').textContent='草稿已保存在本机浏览器'}catch(e){}};
 form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;
 try{const result=await send(actionBody('attempt',{practice_id:id,answer:area.value,self_report:form.elements.self_report.value}));D.history.push(result.event);try{localStorage.removeItem(key);await navigator.clipboard.writeText(reviewPrompt(result.event))}catch(e){}toast('作答已保存，批阅请求已准备好；刷新后可在历史记录中复制。');form.reset();const p=document.createElement('p');p.className='notice';p.textContent='作答已保存，等待当前聊天批阅。';form.after(p)}catch(e){toast(e.message)}finally{button.disabled=false}};
 card.querySelectorAll('[data-review]').forEach(button=>button.onclick=async()=>{const a=D.history.find(e=>e.id===button.dataset.review);try{await navigator.clipboard.writeText(reviewPrompt(a));toast('已复制批阅请求，粘贴到当前聊天即可。')}catch(e){toast(reviewPrompt(a))}});
 });
}
function practice(){
 const due=D.catalog.knowledge_points.filter(k=>state(k.id).due),pending=D.history.filter(e=>e.kind==='attempt'&&!D.history.some(r=>r.kind==='review'&&r.attempt_id===e.id));
 V.innerHTML=header('REVIEW & REINFORCEMENT','练过的题，留下下一步。','先补当前缺口，再用同类变式和间隔复习检查方法是否留下来了。')+`<div class="metrics"><div class="metric"><b>${D.practice.length}</b><span>已入库补强题</span></div><div class="metric"><b>${D.history.filter(e=>e.kind==='attempt').length}</b><span>实际提交的作答</span></div><div class="metric"><b>${pending.length}</b><span>等待聊天批阅</span></div><div class="metric"><b>${due.length}</b><span>建议现在复习的知识点</span></div></div>${due.length?`<div class="notice">建议复习：${due.map(k=>h(k.title)).join('、')}。优先选一道没看过答案的同类题。</div>`:'<div class="notice">没有已到期的复习记录。还未评估的知识点，可先做基础诊断；不把没有记录解释为已经掌握。</div>'}<div class="section-title"><h2>补强题库</h2><a href="#questions">按原题选择下一轮 →</a></div>${D.practice.map(p=>practiceCard(p.id)).join('')||'<p class="empty">选择一道原题，点击生成下一轮补强题。</p>'}<div class="section-title"><h2>生成任务</h2><span class="muted">当前聊天处理，本机保留任务</span></div>${D.generations.map(g=>`<div class="card" style="margin:12px 0"><strong>${h(g.question_id)}</strong> ${pill(g.status==='completed'?'新题已入库':'等待当前聊天生成')}<p class="muted">${date(g.created_at_pc)} · ${h(g.id)}</p><a href="../queue/${h(g.id)}.request.json">查看生成任务 JSON →</a><button style="margin-left:12px" data-generation="${h(g.id)}">复制生成请求</button></div>`).join('')||'<p class="muted">尚未提交生成任务。</p>'}`;wirePractice();
 V.querySelectorAll('[data-generation]').forEach(button=>button.onclick=async()=>{const g=D.generations.find(g=>g.id===button.dataset.generation);const prompt=`请处理 ${D.storage_root}/knowledge/queue/${g.id}.request.json 的补强生成任务；先读 ${D.storage_root}/knowledge/${D.course.id}/snapshot.json，按 response_schema 生成并核对新题，写入 ${D.storage_root}/knowledge/incoming/ 新 JSON。`;try{await navigator.clipboard.writeText(prompt);toast('已复制生成请求。')}catch(e){toast(prompt)}});
}
function route(){
 const hash=location.hash.slice(1)||'overview';let nav=hash;
 if(hash.startsWith('question=')){nav='questions';let id;try{id=decodeURIComponent(hash.slice(9))}catch(e){id=''}question(id);document.getElementById('breadcrumb').textContent=qs(id)?.label||'原题'}
 else if(hash==='questions'){questions();document.getElementById('breadcrumb').textContent='原题与作答'}
 else if(hash==='practice'){practice();document.getElementById('breadcrumb').textContent='复习与补强'}
 else{overview();nav='overview';document.getElementById('breadcrumb').textContent='课程总览';if(hash.startsWith('chapter-'))requestAnimationFrame(()=>document.getElementById(hash)?.scrollIntoView())}
 if(nav==='overview'){
  const p={retry_days:1,independent_days:3,retained_days:7,retention_gap_days:1,...D.catalog.review_policy};
  const note=V.querySelector('.notice .muted');if(note)note.textContent=`掌握状态按作答和复练证据更新；一次独立完成后建议 ${p.independent_days} 天复习，不同题间隔至少 ${p.retention_gap_days} 天再次完成后建议 ${p.retained_days} 天复习。提示后完成或做错，建议 ${p.retry_days} 天后换题再试。安排可按课程调整。`;
 }
 V.querySelectorAll('[data-generation]').forEach(button=>{
  const g=D.generations.find(g=>g.id===button.dataset.generation);
  button.parentElement.querySelector('.pill').textContent=({pending:'等待当前聊天生成',completed:'新题已入库',superseded:'已由新证据替代'})[g.status]||g.status;
  if(g.status==='superseded')button.disabled=true;
 });
 document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===nav));window.scrollTo(0,0);
}
document.getElementById('updated').textContent='更新 '+new Date(D.updated_at_pc*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
document.getElementById('chapters').innerHTML='<span class="eyebrow">COURSE MAP</span>'+D.catalog.chapters.map((c,i)=>`<a href="#chapter-${h(c.id)}">${String(i+1).padStart(2,'0')} / ${h(c.title)}</a>`).join('');
window.addEventListener('hashchange',route);route();
// Never auto-refresh while the learner reads or drafts an answer.
setInterval(()=>{if(Date.now()/1000-D.updated_at_pc>90)document.getElementById('fresh').textContent=' 阅读中不会自动刷新；保存或批阅后，可手动刷新查看新记录。'},10000);
</script></body></html>
