<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>笔迹接收</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#16384a;background:#edf2f4}
*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1440px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}
h1{margin:0 0 8px;font-size:28px}p{margin:0;color:#546a75;line-height:1.6}
.badge{padding:10px 16px;border-radius:20px;background:#fff;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}.stat{background:white;border-radius:12px;padding:12px 20px;min-width:160px}
.stat strong{display:block;font-size:25px}.stat span{font-size:13px;color:#546a75}
.board{position:relative;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #d8e2e7}
canvas{width:100%;display:block;aspect-ratio:2800/1840;background-image:radial-gradient(#dce5e9 .75px,transparent .75px);background-size:20px 20px}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#6c818c;text-align:center;padding:20px}
footer{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px;color:#546a75}
button{background:#16384a;border:0;color:white;border-radius:9px;padding:10px 16px;cursor:pointer}
select{padding:10px;border:1px solid #d8e2e7;border-radius:9px;max-width:100%}#session-info{font-size:13px;margin:10px 0;overflow-wrap:anywhere}
#path{overflow-wrap:anywhere}#warning{margin:12px 0;color:#a35120;min-height:20px}
@media(max-width:600px){body{padding:12px}header,footer{align-items:flex-start;flex-direction:column}.stat{min-width:130px}}
</style>
<main>
<header><div><h1>笔迹接收</h1><p>直接显示收到的笔尖轨迹与压感。平板连接后，继续在华为笔记里书写。</p></div><div class="badge" id="status">等待连接</div></header>
<div class="stats"><div class="stat"><strong id="points">0</strong><span>输入点</span></div><div class="stat"><strong id="pen">0</strong><span>笔输入点</span></div><div class="stat"><strong id="pressure">—</strong><span>最近笔压</span></div><div class="stat"><strong id="gaps">0</strong><span>序号缺失 / 异常</span></div></div>
<div class="board"><canvas id="canvas" width="2800" height="1840"></canvas><div id="empty">等待笔迹数据<br>画布仅重建输入轨迹，笔记中的滚动、擦除和撤销尚未同步。</div></div>
<p id="session-info"></p><label>查看会话 <select id="session"><option value="">全部收到的输入</option></select></label>
<div id="warning"></div>
<footer><div>本次记录：<span id="path">等待接收器</span></div><button id="clear">清空显示</button></footer>
</main>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),active=new Map();
let cursor=0,busy=false,lastSeq=null,lastSession=null,cacheWarning=false,sessionSignature='';
const sessionSelect=document.getElementById('session');
sessionSelect.onchange=()=>{cursor=0;lastSeq=null;lastSession=null;cacheWarning=false;clear();};
function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);active.clear();document.getElementById('empty').style.display='grid';}
document.getElementById('clear').onclick=clear;
function draw(p){
  if(lastSeq!==null&&(p.seq!==lastSeq+1||p.session_id!==lastSession))active.clear();lastSeq=p.seq;lastSession=p.session_id;
  if(![1,3,4,5].includes(p.tool_type))return;
  const key=p.display_id+':'+p.pointer_id,prev=active.get(key);
  const width=1.5+p.pressure*7;ctx.strokeStyle='#16384a';ctx.fillStyle='#16384a';ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';
  if(p.action===1){ctx.beginPath();ctx.arc(p.x,p.y,width/2,0,2*Math.PI);ctx.fill();active.set(key,p);}
  else if(p.action===2||p.action===3){if(prev){ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(p.x,p.y);ctx.stroke();}if(p.action===3)active.delete(key);else active.set(key,p);}
  else if(p.action===0)active.delete(key);
  document.getElementById('empty').style.display='none';document.getElementById('pressure').textContent=p.pressure.toFixed(3);
}
async function poll(){if(busy)return;busy=true;try{
  const requestedSession=sessionSelect.value;
  const response=await fetch('/events?after='+cursor+(requestedSession?'&session_id='+encodeURIComponent(requestedSession):''),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);
  if(requestedSession!==sessionSelect.value)return;
  const state=await response.json();if(state.reset){clear();lastSeq=null;cacheWarning=true;}
  const sessions=state.sessions||[],signature=sessions.map(s=>s.session_id+':'+s.state).join(',');
  if(signature!==sessionSignature){sessionSignature=signature;const selected=sessionSelect.value;
    sessionSelect.replaceChildren(new Option('全部收到的输入',''));
    for(const s of sessions)sessionSelect.add(new Option(s.session_id.slice(0,8)+' · '+s.state,s.session_id));
    sessionSelect.value=selected;
    if(!selected&&sessions.length){sessionSelect.value=sessions[sessions.length-1].session_id;sessionSelect.onchange();return;}
  }
  for(const event of state.events){draw(event.point);cursor=event.cursor;}
  cursor=state.next_cursor??cursor;
  document.getElementById('status').textContent=state.stopped?'接收已结束':state.connected?'正在接收':'等待平板连接';
  if(state.synthetic)document.getElementById('status').textContent='模拟演示 · 非平板笔迹';
  document.getElementById('points').textContent=state.points.toLocaleString();document.getElementById('pen').textContent=state.pen_points.toLocaleString();
  document.getElementById('gaps').textContent=(state.sequence_gaps+state.sequence_reorders).toLocaleString();document.getElementById('path').textContent=state.records_path;
  const problems=[];if(cacheWarning)problems.push('显示缓存已截断，完整记录请查看保存的文件。');
  const selected=sessions.find(s=>s.session_id===sessionSelect.value);
  document.getElementById('session-info').textContent=selected?`${selected.session_id} · ${selected.state} · 已保存 ${selected.byte_length} 字节 · ${selected.raw_path}`:'计数包括本轮接收器收到及从磁盘恢复的输入。';
  if(selected&&selected.loss_accounting_complete===false)problems.push('此会话异常中断，原生丢点统计不完整。');
  if(state.invalid_records||state.truncated_records)problems.push('收到无效或不完整记录，请检查采集报告。');
  if(state.sequence_gaps||state.sequence_reorders)problems.push('记录序号存在缺失或异常，轨迹可能不完整。');
  document.getElementById('warning').textContent=problems.join(' ');
}catch(e){document.getElementById('status').textContent='接收器未运行';}finally{busy=false;}}
poll();setInterval(poll,100);
</script>
</html>
